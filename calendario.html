/* ─── Icons ─────────────────────────────────────────────────────────── */
const Icon = ({ name, size = 18, stroke = 1.6, style }) => {
  const c = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: 'currentColor', strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round', style };
  switch (name) {
    case 'calendar': return (<svg {...c}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/></svg>);
    case 'clock':    return (<svg {...c}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>);
    case 'doc':      return (<svg {...c}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>);
    case 'users':    return (<svg {...c}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5c2.4.4 4.2 2 5 5"/></svg>);
    case 'car':      return (<svg {...c}><path d="M3 13l2-5a3 3 0 0 1 2.8-2h8.4A3 3 0 0 1 19 8l2 5"/><path d="M3 13h18v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="15.5" r=".8" fill="currentColor" stroke="none"/><circle cx="16.5" cy="15.5" r=".8" fill="currentColor" stroke="none"/></svg>);
    case 'plus':     return (<svg {...c}><path d="M12 5v14M5 12h14"/></svg>);
    case 'search':   return (<svg {...c}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>);
    case 'download': return (<svg {...c}><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>);
    case 'left':     return (<svg {...c}><path d="M14 6l-6 6 6 6"/></svg>);
    case 'right':    return (<svg {...c}><path d="M10 6l6 6-6 6"/></svg>);
    case 'down':     return (<svg {...c}><path d="M6 9l6 6 6-6"/></svg>);
    case 'close':    return (<svg {...c}><path d="M6 6l12 12M18 6L6 18"/></svg>);
    case 'check':    return (<svg {...c}><path d="M4 12l5 5L20 6"/></svg>);

    case 'logout':   return (<svg {...c}><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>);
    case 'bell':     return (<svg {...c}><path d="M6 16v-5a6 6 0 1 1 12 0v5l1 2H5z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>);
    case 'settings': return (<svg {...c}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9 1.7 1.7 0 0 0 4.3 7.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.2.6.7 1 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>);
    case 'sparkle':  return (<svg {...c}><path d="M12 3l1.6 4.5L18 9l-4.4 1.5L12 15l-1.6-4.5L6 9l4.4-1.5z"/></svg>);
    case 'map':      return (<svg {...c}><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>);
    case 'arrows':   return (<svg {...c}><path d="M7 4v16M3 8l4-4 4 4"/><path d="M17 20V4M21 16l-4 4-4-4"/></svg>);
    default: return null;
  }
};

/* ─── Date helpers ──────────────────────────────────────────────────── */
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOWS   = ['dom','lun','mar','mié','jue','vie','sáb'];
const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = (s) => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); };
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

/* ─── UI primitives ─────────────────────────────────────────────────── */
const Button = ({ variant='secondary', size='md', icon, iconRight, children, style, ...p }) => {
  const sizes = {
    sm: { padding:'6px 10px', fontSize:12.5, height:30 },
    md: { padding:'8px 14px', fontSize:13.5, height:36 },
  };
  const variants = {
    primary:   { background:'var(--brand)',  color:'var(--brand-ink)', borderColor:'var(--brand)' },
    secondary: { background:'var(--surface)',color:'var(--ink)',       borderColor:'var(--line-strong)' },
    ghost:     { background:'transparent',   color:'var(--ink-3)',     borderColor:'transparent' },
    danger:    { background:'#fff',          color:'#b3261e',          borderColor:'#f1d5d2' },
  };
  return (
    <button {...p} style={{
      display:'inline-flex', alignItems:'center', gap:8,
      fontFamily:'var(--font-sans)', fontWeight:500,
      border:'1px solid transparent', borderRadius:'var(--radius)',
      cursor:'pointer', whiteSpace:'nowrap',
      transition:'background .12s, border-color .12s, color .12s',
      ...sizes[size], ...variants[variant], ...style,
    }}>
      {icon && <Icon name={icon} size={size==='sm'?14:16}/>}
      {children}
      {iconRight && <Icon name={iconRight} size={size==='sm'?14:16}/>}
    </button>
  );
};

const IconBtn = ({ icon, onClick, title, size=34 }) => (
  <button onClick={onClick} title={title}
    style={{ width:size, height:size, display:'inline-flex', alignItems:'center', justifyContent:'center',
      background:'transparent', border:'1px solid transparent', borderRadius:8,
      color:'var(--ink-3)', cursor:'pointer', transition:'background .12s' }}
    onMouseEnter={e=>{ e.currentTarget.style.background='var(--bg-sunk)'; e.currentTarget.style.color='var(--ink)'; }}
    onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--ink-3)'; }}>
    <Icon name={icon} size={17}/>
  </button>
);

const Field = ({ label, children, hint }) => (
  <label style={{ display:'flex', flexDirection:'column', gap:6 }}>
    {label && <span style={{ fontSize:12, fontWeight:500, color:'var(--ink-3)' }}>{label}</span>}
    {children}
    {hint && <span style={{ fontSize:11.5, color:'var(--ink-4)' }}>{hint}</span>}
  </label>
);

const inputBase = {
  height:38, padding:'0 12px', borderRadius:'var(--radius)',
  border:'1px solid var(--line-strong)', background:'var(--surface)',
  fontSize:14, outline:'none', width:'100%',
};
const Input = (p) => (
  <input {...p} style={{ ...inputBase, ...(p.style||{}) }}
    onFocus={e=>{ e.target.style.borderColor='var(--brand)'; e.target.style.boxShadow='0 0 0 3px rgba(31,37,64,.08)'; }}
    onBlur={e=>{ e.target.style.borderColor='var(--line-strong)'; e.target.style.boxShadow='none'; }}/>
);
const Textarea = (p) => (
  <textarea {...p} style={{ ...inputBase, height:'auto', minHeight:80, padding:'10px 12px', resize:'vertical', ...(p.style||{}) }}
    onFocus={e=>{ e.target.style.borderColor='var(--brand)'; e.target.style.boxShadow='0 0 0 3px rgba(31,37,64,.08)'; }}
    onBlur={e=>{ e.target.style.borderColor='var(--line-strong)'; e.target.style.boxShadow='none'; }}/>
);
const SelectEl = (p) => (
  <div style={{ position:'relative', width: p.width||'100%' }}>
    <select {...p} style={{ ...inputBase, appearance:'none', paddingRight:34, cursor:'pointer', ...(p.style||{}) }}>{p.children}</select>
    <div style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', pointerEvents:'none', color:'var(--ink-4)' }}>
      <Icon name="down" size={16}/>
    </div>
  </div>
);

const Segmented = ({ value, onChange, options }) => (
  <div style={{ display:'inline-flex', padding:3, background:'var(--bg-sunk)', borderRadius:'var(--radius)', border:'1px solid var(--line)' }}>
    {options.map(opt => {
      const active = value === opt.value;
      return (
        <button key={opt.value} onClick={() => onChange(opt.value)}
          style={{
            padding:'6px 12px', fontSize:13, fontWeight:500,
            background: active ? 'var(--surface)' : 'transparent',
            color: active ? 'var(--ink)' : 'var(--ink-3)',
            border:0, borderRadius:7, cursor:'pointer',
            boxShadow: active ? 'var(--shadow-sm)' : 'none',
          }}>{opt.label}</button>
      );
    })}
  </div>
);

    color:'#fff', display:'inline-flex', alignItems:'center', justifyContent:'center',

/* ─── Header ────────────────────────────────────────────────────────── */
const Header = ({ onLogout }) => {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  return (
    <header style={{
      height:64, flexShrink:0, background:'var(--surface)',
      borderBottom:'1px solid var(--line)',
      display:'flex', alignItems:'center', padding:'0 28px', gap:20,
      position:'sticky', top:0, zIndex:20,
    }}>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--ink-4)', marginBottom:2 }}>
          <span>Módulos</span><span>/</span><span>Calendario</span>
        </div>
        <div style={{ display:'flex', alignItems:'baseline', gap:12 }}>
          <h1 style={{ margin:0, fontSize:19, fontWeight:600, letterSpacing:'-.01em' }}>Calendario institucional</h1>
          <span style={{ fontSize:13, color:'var(--ink-4)' }}>Ciclo escolar 2025–2026</span>
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <IconBtn icon="search" title="Buscar"/>
        <IconBtn icon="bell" title="Notificaciones"/>
        <div style={{ width:1, height:24, background:'var(--line)', margin:'0 4px' }}/>

    <div onClick={onClose} style={{

/* ─── Mini-month picker (sidebar) ──────────────────────────────────── */
const MiniMonth = ({ cursor, today, onPickDate, eventsByDate }) => {
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const first = new Date(year, month, 1);
  const offset = first.getDay();
  const cells = Array.from({length:42}, (_,i) => {
    const d = new Date(year, month, 1 - offset + i);
    return d;
  });
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', rowGap:2, columnGap:2, marginTop:8 }}>
      {DOWS.map(d => (
        <div key={d} style={{ fontSize:10, color:'var(--ink-5)', textAlign:'center', padding:'4px 0', textTransform:'uppercase', letterSpacing:'.05em' }}>{d[0]}</div>
      ))}
      {cells.map((d,i) => {
        const inMonth = d.getMonth() === month;
        const isToday = sameDay(d, today);
        const has = (eventsByDate[fmt(d)] || []).length > 0;
        return (
          <button key={i} onClick={()=>onPickDate(d)} style={{
            aspectRatio:'1/1', border:0, background:'transparent', cursor:'pointer',
            borderRadius:6,
            display:'flex', alignItems:'center', justifyContent:'center',
            position:'relative',
            color: !inMonth ? 'var(--ink-5)' : (isToday ? '#fff' : 'var(--ink-2)'),
            background: isToday ? 'var(--brand)' : 'transparent',
            fontSize:11.5, fontWeight: isToday ? 600 : 500,
          }}
            onMouseEnter={e=>{ if (!isToday) e.currentTarget.style.background='var(--bg-sunk)'; }}
            onMouseLeave={e=>{ if (!isToday) e.currentTarget.style.background='transparent'; }}>
            {d.getDate()}
            {has && !isToday && <span style={{ position:'absolute', bottom:3, left:'50%', transform:'translateX(-50%)', width:3, height:3, borderRadius:999, background:'var(--brand)' }}/>}
            {has && isToday && <span style={{ position:'absolute', bottom:3, left:'50%', transform:'translateX(-50%)', width:3, height:3, borderRadius:999, background:'#fff' }}/>}
          </button>
        );
      })}
    </div>
  );
};

/* ─── Month grid with spanning multi-day bars ──────────────────────── */
const MonthGrid = ({ cells, monthIdx, today, eventsByWeek, onEventClick, onDayClick }) => {
  // cells is 42 days, weeks are rows of 7
  const weeks = [];
  for (let i = 0; i < 6; i++) weeks.push(cells.slice(i*7, i*7+7));

  return (
    <div style={{
      flex:1, display:'flex', flexDirection:'column',
      border:'1px solid var(--line)', borderRadius:'var(--radius-lg)',
      background:'var(--surface)', overflow:'hidden',
    }}>
      {/* Day-of-week header */}
      <div style={{
        display:'grid', gridTemplateColumns:'repeat(7, 1fr)',
        background:'var(--surface-2)', borderBottom:'1px solid var(--line)',
      }}>
        {DOWS.map(d => (
          <div key={d} style={{ padding:'10px 12px', fontSize:11, fontWeight:600,
            color:'var(--ink-4)', textTransform:'uppercase', letterSpacing:'.08em' }}>{d}</div>
        ))}
      </div>

      <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
        {weeks.map((week, wi) => (
          <WeekRow key={wi} week={week} monthIdx={monthIdx} today={today}
            weekIdx={wi} totalWeeks={6}

        ))}
      </div>
    </div>

};

const WeekRow = ({ week, monthIdx, today, weekIdx, totalWeeks, placed, onEventClick, onDayClick }) => {
  // Each row has 7 day cells + absolutely positioned event bars
  return (
    <div style={{
      flex:1, minHeight:0, position:'relative',
      display:'grid', gridTemplateColumns:'repeat(7, 1fr)',
      borderBottom: weekIdx < totalWeeks - 1 ? '1px solid var(--line)' : 'none',
    }}>
      {/* Day cells (background) */}
      {week.map((d, di) => {
        const inMonth = d.getMonth() === monthIdx;
        const isToday = sameDay(d, today);
        return (
          <div key={di} onClick={()=>onDayClick(d)} style={{
            borderRight: di < 6 ? '1px solid var(--line)' : 'none',
            background: inMonth ? 'var(--surface)' : 'var(--surface-2)',
            opacity: inMonth ? 1 : 0.55,
            cursor:'pointer', position:'relative',
            transition:'background .12s',
          }}
            onMouseEnter={e=>{ if (inMonth) e.currentTarget.style.background='var(--surface-2)'; }}
            onMouseLeave={e=>{ if (inMonth) e.currentTarget.style.background= inMonth ? 'var(--surface)' : 'var(--surface-2)'; }}>
            <div style={{ display:'flex', justifyContent:'flex-end', padding:'6px 8px 0' }}>
              {isToday ? (
                <span style={{
                  width:22, height:22, borderRadius:'50%',
                  background:'var(--brand)', color:'#fff',
                  display:'inline-flex', alignItems:'center', justifyContent:'center',
                  fontSize:11.5, fontWeight:600,
                }}>{d.getDate()}</span>
              ) : (
                <span style={{ fontSize:12, fontWeight:500,
                  color: inMonth ? 'var(--ink-2)' : 'var(--ink-5)', padding:'2px 6px' }}>{d.getDate()}</span>
              )}
            </div>
          </div>
        );
      })}

      {/* Event bars layered absolutely */}
      <div style={{ position:'absolute', inset:'30px 0 4px', pointerEvents:'none' }}>
        {placed.map((p, pi) => {
          const sec = sectionOf(p.event.sections[0]);
          const left  = (p.startCol / 7) * 100;
          const width = ((p.endCol - p.startCol + 1) / 7) * 100;
          const top   = p.row * 22;
          if (p.kind === 'overflow') {
            return (
              <div key={pi} style={{
                position:'absolute', left: `calc(${left}% + 6px)`, top: top + 2,
                fontSize:11, color:'var(--ink-4)', fontWeight:500,
                pointerEvents:'auto', cursor:'pointer',
              }}>+ {p.count} más</div>
            );
          }
          return (
            <button key={pi} onClick={(e)=>{ e.stopPropagation(); onEventClick(p.event); }}
              style={{
                position:'absolute',
                left: `calc(${left}% + 4px)`,
                width: `calc(${width}% - 8px)`,
                top, height: 19,
                background: sec.soft, color:'var(--ink-2)',
                border:0, borderLeft:`3px solid ${sec.color}`,
                borderRadius:4, textAlign:'left',
                padding: '2px 6px',
                fontSize:11.5, fontWeight:500,
                display:'flex', alignItems:'center', gap:6,
                overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis',
                pointerEvents:'auto', cursor:'pointer',
              }}>
              {p.event.time && p.continuesFromPrev !== true && p.event.time !== 'Todo el día' && (
                <span style={{ color:'var(--ink-4)', fontSize:10.5, fontFamily:'var(--font-mono)', fontWeight:400 }}>
                  {p.event.time.split('–')[0].trim()}
                </span>
              )}
              <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.event.title}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
};

/* ─── Week view ─────────────────────────────────────────────────────── */

    <div style={{
      flex:1, display:'grid', gridTemplateColumns:'repeat(7, 1fr)',
      border:'1px solid var(--line)', borderRadius:'var(--radius-lg)',
      background:'var(--surface)', overflow:'hidden',

/* ─── Helper: place events into weekly rows for the month grid ─────── */
const placeEventsByWeek = (cells, filteredEvents) => {
  // cells: 42 dates. Returns array of 6 rows, each row contains placements
  // Each event becomes one or more "segments" — one per week it touches.
  // For each row, assign a "lane" (row index) to avoid overlaps.
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const weekStart = cells[w*7];
    const weekEnd   = cells[w*7 + 6];
    const segments = [];

    filteredEvents.forEach(ev => {
      const start = parse(ev.start), end = parse(ev.end);
      // intersect with this week
      if (end < weekStart || start > weekEnd) return;
      const segStart = start < weekStart ? weekStart : start;
      const segEnd   = end   > weekEnd   ? weekEnd   : end;
      const startCol = Math.floor((segStart - weekStart) / (1000*60*60*24));
      const endCol   = Math.floor((segEnd   - weekStart) / (1000*60*60*24));
      segments.push({
        event: ev,
        startCol, endCol,
        continuesFromPrev: start < weekStart,
        continuesToNext:   end   > weekEnd,
        sortKey: startCol * 1000 + (endCol - startCol) * -1, // earlier first, longer first
      });
    });

    // sort: earlier first, longer spans first
    segments.sort((a, b) => {
      if (a.startCol !== b.startCol) return a.startCol - b.startCol;
      const aLen = a.endCol - a.startCol, bLen = b.endCol - b.startCol;
      return bLen - aLen;
    });

    // assign lanes (rows)
    const lanes = []; // each lane is a list of [startCol, endCol]
    const MAX_LANES = 3;
    const placed = [];
    const overflowPerDay = {}; // col -> count

    segments.forEach(seg => {
      let lane = -1;
      for (let i = 0; i < MAX_LANES; i++) {
        const conflicts = (lanes[i] || []).some(([s, e]) => !(seg.endCol < s || seg.startCol > e));
        if (!conflicts) { lane = i; break; }
      }
      if (lane === -1) {
        // overflow
        for (let c = seg.startCol; c <= seg.endCol; c++) overflowPerDay[c] = (overflowPerDay[c] || 0) + 1;
      } else {
        lanes[lane] = lanes[lane] || [];
        lanes[lane].push([seg.startCol, seg.endCol]);
        placed.push({ kind:'event', row: lane, ...seg });
      }
    });

    // Add overflow markers
    Object.entries(overflowPerDay).forEach(([col, count]) => {
      placed.push({ kind:'overflow', row: MAX_LANES, startCol: +col, endCol: +col, count });
    });

    weeks.push(placed);
  }
  return weeks;
};

/* ─── App ───────────────────────────────────────────────────────────── */
const App = () => {
  const [cursor, setCursor] = useState(new Date(2026, 4, 1));
  const [view, setView] = useState('mes');
  const [events, setEvents] = useState(INITIAL_EVENTS);
  const [modal, setModal] = useState(null);
  const [sectionFilter, setSectionFilter] = useState(SECTIONS.map(s => s.id));
  const [typeFilter, setTypeFilter] = useState('todos');
  const [search, setSearch] = useState('');

  const today = new Date(2026, 4, 18);
  const year = cursor.getFullYear(), month = cursor.getMonth();

  // Grid cells
  const cells = useMemo(() => {
    const first = new Date(year, month, 1);
    const offset = first.getDay();
    return Array.from({length:42}, (_,i) => { const d = new Date(year, month, 1 - offset + i); return d; });
  }, [year, month]);

  // Filter
  const filtered = useMemo(() => events.filter(e =>
    e.sections.some(s => sectionFilter.includes(s)) &&
    (typeFilter === 'todos' || e.type === typeFilter) &&
    (search === '' || e.title.toLowerCase().includes(search.toLowerCase()))
  ), [events, sectionFilter, typeFilter, search]);

  // Index by date (single-day view of multi-day events)
  const eventsByDate = useMemo(() => {
    const map = {};
    filtered.forEach(e => {
      const s = parse(e.start), en = parse(e.end);
      for (let d = new Date(s); d <= en; d.setDate(d.getDate()+1)) {
        (map[fmt(d)] ||= []).push(e);
      }
    });
    return map;
  }, [filtered]);

  // Events for month (used by sidebar & counts)
  const monthEvents = useMemo(() => filtered.filter(e => {
    const d = parse(e.start);
    return d.getFullYear() === year && d.getMonth() === month;
  }).sort((a,b) => a.start.localeCompare(b.start)), [filtered, year, month]);

  // Placement for month grid
  const eventsByWeek = useMemo(() => placeEventsByWeek(cells, filtered), [cells, filtered]);

  // Handlers
  const goToday = () => setCursor(new Date(2026, 4, 1));
  const nav = (delta) => setCursor(d => new Date(d.getFullYear(), d.getMonth()+delta, 1));
  const openEvent = (ev) => setModal({ draft: ev, isNew: false });
  const openNew = (start) => {
    const s = start || fmt(today);
    setModal({
      draft: { id: Date.now(), title:'', desc:'', start: s, end: s, time:'09:00 – 10:00', type:'reunion', sections:['general'], place:'' },
      isNew: true,
    });
  };
  const saveEvent = (ev) => {
    setEvents(es => es.find(e => e.id === ev.id) ? es.map(e => e.id === ev.id ? ev : e) : [...es, ev]);
    setModal(null);
  };
  const deleteEvent = (id) => { setEvents(es => es.filter(e => e.id !== id)); setModal(null); };
  const toggleSection = (id) => setSectionFilter(prev =>
    prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);

  return (
    <div style={{ display:'flex', minHeight:'100vh', background:'var(--bg)' }}>
      <Sidebar/>

      <main style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }}>
        <Header onLogout={()=>{}}/>

        {/* Toolbar */}
        <div style={{ padding:'18px 28px 14px', borderBottom:'1px solid var(--line)', background:'var(--surface)' }}>
          <div style={{ display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
            <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <IconBtn icon="left" onClick={()=>nav(-1)} title="Mes anterior"/>
              <IconBtn icon="right" onClick={()=>nav(1)} title="Mes siguiente"/>
              <Button variant="ghost" size="sm" onClick={goToday} style={{ marginLeft:4 }}>Hoy</Button>
            </div>
            <h2 style={{
              margin:0, fontSize:24, fontWeight:600, letterSpacing:'-.02em',
              display:'flex', alignItems:'baseline', gap:8,
            }}>
              <span style={{ textTransform:'capitalize' }}>{MONTHS[month]}</span>
              <span style={{ color:'var(--ink-4)', fontWeight:400 }}>{year}</span>
            </h2>

            <div style={{ flex:1 }}/>

            <div style={{ position:'relative' }}>
              <span style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', color:'var(--ink-4)' }}>
                <Icon name="search" size={14}/>
              </span>
              <Input placeholder="Buscar evento…" value={search} onChange={e=>setSearch(e.target.value)}
                style={{ paddingLeft:32, height:32, width:220, fontSize:13 }}/>
            </div>

            <Segmented value={view} onChange={setView}
              options={[{value:'mes',label:'Mes'},{value:'semana',label:'Semana'},{value:'dia',label:'Día'}]}/>

            <Button variant="secondary" icon="download">Exportar PDF</Button>
            <Button variant="primary" icon="plus" onClick={()=>openNew()}>Nuevo evento</Button>
          </div>

          {/* Filters row */}
          <div style={{ display:'flex', alignItems:'center', gap:16, marginTop:14, flexWrap:'wrap' }}>
            <span style={{ fontSize:11, fontWeight:600, color:'var(--ink-4)', letterSpacing:'.07em', textTransform:'uppercase' }}>Secciones</span>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              {SECTIONS.map(s => {
                const on = sectionFilter.includes(s.id);
                return (
                  <button key={s.id} onClick={()=>toggleSection(s.id)} style={{
                    display:'inline-flex', alignItems:'center', gap:7,
                    padding:'5px 11px', borderRadius:999, cursor:'pointer',
                    border:'1px solid ' + (on?'transparent':'var(--line-strong)'),
                    background: on ? s.soft : 'transparent',
                    color: on ? 'var(--ink)' : 'var(--ink-4)',
                    fontSize:12, fontWeight:500, opacity: on ? 1 : 0.7,
                  }}>
                    <span style={{ width:8, height:8, borderRadius:999, background: s.color }}/>
                    {s.label}
                  </button>
                );
              })}
            </div>

            <div style={{ width:1, height:22, background:'var(--line)' }}/>

            <span style={{ fontSize:11, fontWeight:600, color:'var(--ink-4)', letterSpacing:'.07em', textTransform:'uppercase' }}>Tipo</span>
            <SelectEl value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{ height:30, fontSize:12.5, width:170 }}>
              <option value="todos">Todos los tipos</option>
              {EVENT_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </SelectEl>

            <div style={{ flex:1 }}/>

            <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12.5, color:'var(--ink-3)' }}>
              <Icon name="calendar" size={14}/>
              <span><strong style={{ color:'var(--ink)', fontWeight:600 }}>{monthEvents.length}</strong> eventos este mes</span>
            </div>
          </div>
        </div>

        {/* Body */}
        <div style={{ flex:1, minHeight:0, display:'grid', gridTemplateColumns:'minmax(0,1fr) 312px' }}>
          <div style={{ padding:24, display:'flex', flexDirection:'column', minHeight:0 }}>
            {view === 'mes' && (
              <MonthGrid cells={cells} monthIdx={month} today={today}
                eventsByWeek={eventsByWeek} onEventClick={openEvent} onDayClick={(d)=>openNew(fmt(d))}/>
            )}
            {view === 'semana' && (
              <WeekView cursor={cursor} today={today} eventsByDate={eventsByDate} onEventClick={openEvent}/>
            )}
            {view === 'dia' && (
              <DayView cursor={cursor} eventsByDate={eventsByDate} onEventClick={openEvent}/>
            )}
          </div>

          <SideRail cursor={cursor} today={today}
            eventsByDate={eventsByDate} monthEvents={monthEvents}
            onEventClick={openEvent} onPickDate={(d)=>openNew(fmt(d))}
            sectionFilter={sectionFilter}/>
        </div>
      </main>

      {modal && (
        <EventModal draft={modal.draft} isNew={modal.isNew}
          onClose={()=>setModal(null)} onSave={saveEvent} onDelete={deleteEvent}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
