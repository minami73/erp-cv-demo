/* ─── Time helpers ──────────────────────────────────────────────────── */
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];

const DAY_DATES = ['25 may','26 may','27 may','28 may','29 may'];

const START_HOUR = 14;   // 14:00
const END_HOUR   = 18;   // 18:00
const HALF_HEIGHT = 60;  // px per 30 min → 120 px per hour (denser, more breathable than morning)
const TOTAL_MINUTES = (END_HOUR - START_HOUR) * 60;
const TOTAL_HEIGHT  = (END_HOUR - START_HOUR) * 2 * HALF_HEIGHT;

const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const yPx = (hhmm) => ((toMin(hhmm) - START_HOUR * 60) / 60) * (HALF_HEIGHT * 2);
const heightPx = (s, e) => ((toMin(e) - toMin(s)) / 60) * (HALF_HEIGHT * 2);

/* ─── UI primitives ─────────────────────────────────────────────────── */
const Button = ({ variant='secondary', size='md', icon, iconRight, children, active, style, ...p }) => {
  const sizes = {
    sm: { padding:'6px 10px', fontSize:12.5, height:30 },
    md: { padding:'8px 14px', fontSize:13.5, height:36 },
  };
  const variants = {
    primary:   { background:'var(--brand)',   color:'var(--brand-ink)', borderColor:'var(--brand)' },
    secondary: { background: active ? 'var(--brand)' : 'var(--surface)',
                 color:      active ? 'var(--brand-ink)' : 'var(--ink)',
                 borderColor: active ? 'var(--brand)' : 'var(--line-strong)' },
    ghost:     { background:'transparent',    color:'var(--ink-3)', borderColor:'transparent' },
    danger:    { background:'#fff',           color:'#b3261e',      borderColor:'#f1d5d2' },
  };
  return (
    <button {...p} style={{
      display:'inline-flex', alignItems:'center', gap:8,
      fontFamily:'var(--font-sans)', fontWeight:500,
      border:'1px solid transparent', borderRadius:'var(--radius)',
      cursor:'pointer', whiteSpace:'nowrap',
      transition:'background .12s, border-color .12s, color .12s',
      ...sizes[size], ...variants[variant], ...style,
    }}>
      {icon && <Icon name={icon} size={size==='sm'?14:16}/>}
      {children}
      {iconRight && <Icon name={iconRight} size={size==='sm'?14:16}/>}
    </button>
  );
};
const IconBtn = ({ icon, onClick, title, size=34 }) => (

/* ─── Lane placement for overlapping workshops ──────────────────────── */
function placeDay(items) {
  const sorted = [...items].sort((a,b) => toMin(a.start) - toMin(b.start));
  const clusters = [];
  sorted.forEach(c => {
    const last = clusters[clusters.length - 1];
    if (last && toMin(c.start) < last.endMax) {
      last.items.push(c);
      last.endMax = Math.max(last.endMax, toMin(c.end));
    } else {
      clusters.push({ items:[c], endMax: toMin(c.end) });
    }
  });
  const placed = [];
  clusters.forEach(cluster => {
    const lanes = [];
    const assignments = [];
    cluster.items.forEach(c => {
      let lane = -1;
      for (let i = 0; i < lanes.length; i++) {
        if (lanes[i] <= toMin(c.start)) { lane = i; break; }
      }
      if (lane === -1) { lane = lanes.length; lanes.push(0); }
      lanes[lane] = toMin(c.end);
      assignments.push({ item: c, lane });
    });
    const tl = Math.max(1, lanes.length);
    assignments.forEach(a => placed.push({ item: a.item, lane: a.lane, totalLanes: tl }));
  });
  return placed;
}

/* ─── Schedule grid ─────────────────────────────────────────────────── */
const Grid = ({ items, onClick }) => {
  const byDay = useMemo(() => {
    const m = DAYS.map(() => []);
    items.forEach(it => m[it.day].push(it));

      </div>

      <div style={{ overflowY:'auto', flex:1 }}>
        <div style={{
          display:'grid', gridTemplateColumns:`${TIME_COL}px repeat(5, 1fr)`,
          position:'relative',
        }}>
          {/* Time gutter */}
          <div style={{ position:'relative', height: TOTAL_HEIGHT, borderRight:'1px solid var(--line)' }}>
            {Array.from({ length: halfSteps + 1 }, (_, i) => {
              const totalMin = i * 30;
              const h = START_HOUR + Math.floor(totalMin / 60);
              const m = totalMin % 60;
              const isHour = m === 0;
              return (
                <div key={i} style={{
                  position:'absolute', top: i * HALF_HEIGHT - 8, right: 8,
                  fontSize: isHour ? 11 : 10.5,

                }}>

          </div>

          {/* Day columns */}
          {DAYS.map((d, di) => (
            <div key={d} style={{
              position:'relative', height: TOTAL_HEIGHT,
              borderLeft:'1px solid var(--line)',
              background:'var(--surface)',

              {/* Half-hour gridlines */}
              {Array.from({ length: halfSteps + 1 }, (_, i) => (
                <div key={i} style={{

                  height:1,
                  background: i % 2 === 0 ? 'var(--line)' : 'var(--line)',
                  opacity: i % 2 === 0 ? 1 : 0.5,
                }}/>
              ))}

              {/* Workshop blocks */}
              {byDay[di].map(({ item, lane, totalLanes }) => {
                const cat = CATEGORIES[item.cat];
                const top = yPx(item.start);
                const height = heightPx(item.start, item.end);
                const widthPct = 100 / totalLanes;
                const leftPct = lane * widthPct;
                const dense = totalLanes >= 3;
                const veryDense = totalLanes >= 4;
                return (
                  <button key={item.id} onClick={()=>onClick(item)} style={{
                    position:'absolute', top, height: Math.max(height - 3, 28),
                    left: `calc(${leftPct}% + ${lane === 0 ? 4 : 2}px)`,
                    width: `calc(${widthPct}% - ${lane === totalLanes - 1 ? 8 : 4}px)`,
                    background: cat.color, color: cat.ink,
                    border:0, borderRadius:8,
                    boxShadow:'0 1px 0 rgba(0,0,0,.06), 0 4px 12px -6px rgba(0,0,0,.18)',

          </div>
          <SideRail items={filtered} totalAll={WORKSHOPS.length}
            typeFilter={typeFilter} setTypeFilter={setTypeFilter}/>
        </div>
      </main>

      {modal && (
        <WorkshopModal data={modal.data} isNew={modal.isNew} onClose={()=>setModal(null)}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
