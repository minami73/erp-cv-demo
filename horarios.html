/* ─── Time / data helpers ───────────────────────────────────────────── */

const DAY_DATES = ['25 may','26 may','27 may','28 may','29 may']; // demo week

const START_HOUR = 7;   // 07:00
const END_HOUR   = 15;  // 15:00
const HOUR_HEIGHT = 84; // px per hour
const TOTAL_MINUTES = (END_HOUR - START_HOUR) * 60;
const TOTAL_HEIGHT  = (END_HOUR - START_HOUR) * HOUR_HEIGHT;

const toMin = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};
const offsetFromStart = (hhmm) => toMin(hhmm) - START_HOUR * 60;
const yPx = (hhmm) => (offsetFromStart(hhmm) / 60) * HOUR_HEIGHT;
const heightPx = (start, end) => ((toMin(end) - toMin(start)) / 60) * HOUR_HEIGHT;

/* ─── UI primitives ─────────────────────────────────────────────────── */
const Button = ({ variant='secondary', size='md', icon, iconRight, children, active, style, ...p }) => {
  const sizes = {
    sm: { padding:'6px 10px', fontSize:12.5, height:30 },
    md: { padding:'8px 14px', fontSize:13.5, height:36 },
  };
  const variants = {
    primary:   { background:'var(--brand)',   color:'var(--brand-ink)', borderColor:'var(--brand)' },
    secondary: { background: active ? 'var(--brand)' : 'var(--surface)',
                 color:      active ? 'var(--brand-ink)' : 'var(--ink)',
                 borderColor: active ? 'var(--brand)' : 'var(--line-strong)' },
    ghost:     { background:'transparent',    color:'var(--ink-3)', borderColor:'transparent' },
    danger:    { background:'#fff',           color:'#b3261e',      borderColor:'#f1d5d2' },
  };
  return (
    <button {...p} style={{
      display:'inline-flex', alignItems:'center', gap:8,
      fontFamily:'var(--font-sans)', fontWeight:500,
      border:'1px solid transparent', borderRadius:'var(--radius)',
      cursor:'pointer', whiteSpace:'nowrap',
      transition:'background .12s, border-color .12s, color .12s',
      ...sizes[size], ...variants[variant], ...style,
    }}>
      {icon && <Icon name={icon} size={size==='sm'?14:16}/>}
      {children}
      {iconRight && <Icon name={iconRight} size={size==='sm'?14:16}/>}
    </button>
  );
};

const IconBtn = ({ icon, onClick, title, size=34 }) => (
  <button onClick={onClick} title={title}
    style={{ width:size, height:size, display:'inline-flex', alignItems:'center', justifyContent:'center',
      background:'transparent', border:'1px solid transparent', borderRadius:8,
      color:'var(--ink-3)', cursor:'pointer', transition:'background .12s' }}
    onMouseEnter={e=>{ e.currentTarget.style.background='var(--bg-sunk)'; e.currentTarget.style.color='var(--ink)'; }}
    onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--ink-3)'; }}>
    <Icon name={icon} size={17}/>

);

/* ─── Class block layout — handle overlaps with lanes per day ───────── */
function placeDayClasses(classes) {
  // Sort by start
  const sorted = [...classes].sort((a, b) => toMin(a.start) - toMin(b.start));
  // Group overlapping clusters
  const clusters = [];
  sorted.forEach(c => {
    const last = clusters[clusters.length - 1];
    if (last && toMin(c.start) < last.endMax) {
      last.items.push(c);
      last.endMax = Math.max(last.endMax, toMin(c.end));
    } else {
      clusters.push({ items: [c], endMax: toMin(c.end) });
    }
  });
  // Assign lanes within each cluster
  const placed = [];
  clusters.forEach(cluster => {
    const lanes = []; // lanes[i] = endMin of last class in lane i
    cluster.items.forEach(c => {
      let lane = -1;
      for (let i = 0; i < lanes.length; i++) {
        if (lanes[i] <= toMin(c.start)) { lane = i; break; }
      }
      if (lane === -1) { lane = lanes.length; lanes.push(0); }
      lanes[lane] = toMin(c.end);
      placed.push({ class: c, lane, totalLanes: 1 /* fill later */ });
    });
    cluster.items.forEach(c => {
      const found = placed.find(p => p.class.id === c.id);
      // recompute totalLanes for the cluster
    });
    const tl = Math.max(1, lanes.length);
    cluster.items.forEach(c => {
      const found = placed.find(p => p.class.id === c.id);
      if (found) found.totalLanes = tl;
    });
  });
  return placed;
}

              Receso
            </Button>
            <Button variant="secondary" icon="download">Exportar PDF</Button>
            <Button variant="primary" icon="plus" onClick={openNew}>Nueva clase</Button>
          </div>
        </div>

        {/* Body */}
        <div style={{ flex:1, minHeight:0, display:'grid', gridTemplateColumns:'minmax(0,1fr) 300px' }}>
          <div style={{ padding:24, display:'flex', flexDirection:'column', minHeight:0 }}>
            {classes.length > 0 ? (
              <ScheduleGrid classes={classes} showBreaks={showBreaks} onClassClick={openClass}/>
            ) : (
              <div style={{
                flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                background:'var(--surface)', border:'1px dashed var(--line-strong)', borderRadius:'var(--radius-lg)',
                color:'var(--ink-4)', gap:8,
              }}>
                <Icon name="clock" size={28}/>
                <div style={{ fontSize:14, fontWeight:500, color:'var(--ink-2)' }}>Sin horario cargado</div>
                <div style={{ fontSize:12.5 }}>Selecciona otro docente o crea una nueva clase.</div>
              </div>
            )}
          </div>

          <SideRail classes={classes} teacher={teacherObj} showBreaks={showBreaks}/>
        </div>
      </main>

      {modal && (
        <ClassModal data={modal.data} isNew={modal.isNew} onClose={()=>setModal(null)}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
